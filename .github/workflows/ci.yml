name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: "Tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # customtkinter requires a display; Pillow and cryptography do not.
      # We install a virtual framebuffer so the import chain doesn't crash.
      - name: Install virtual display (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run --auto-servernum python -m pytest tests/ -v --tb=short
